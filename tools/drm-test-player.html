<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DRM Test Player</title>
<!--
  Test player for castLabs DRMtoday-protected streams from origin-mediaserver
  (Shaka Player: Widevine in Chrome/Firefox, PlayReady in Edge).

  Hosted at https://edge-l1-in-bom-ovh01.cdnized.com/drmtest/ (nginx web
  root /home/sirhan/condash/cdnservice/filemanager/drmtest/index.html).
  EME needs an HTTPS page, and an HTTPS page can't load the origin's plain
  http://...:8080 stream (mixed content), so the stream must also come over
  HTTPS, e.g. an nginx location /origin/ proxying to http://127.0.0.1:8080/.

  Licenses come from DRMtoday staging with the x-dt-custom-data header
  (base64 JSON: userId, sessionId, merchant), which DRMtoday's "Test dummy"
  license delivery authorization accepts for its test values.
-->
<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.12.6/dist/shaka-player.compiled.js"></script>
<style>
  :root {
    --bg: #f6f7f9; --surface: #ffffff; --fg: #1b1f24; --muted: #5b6573;
    --border: #d8dde3; --primary: #3b5bdb; --ok: #2b8a3e; --err: #c92a2a; --warn: #b35c00;
    --code-bg: #f0f2f5;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151a; --surface: #1b2027; --fg: #e6e9ee; --muted: #9aa4b2;
      --border: #2e3640; --primary: #7c93f5; --ok: #69db7c; --err: #ff8787; --warn: #ffc078;
      --code-bg: #232a33;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12151a; --surface: #1b2027; --fg: #e6e9ee; --muted: #9aa4b2;
    --border: #2e3640; --primary: #7c93f5; --ok: #69db7c; --err: #ff8787; --warn: #ffc078;
    --code-bg: #232a33;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { margin: 0 0 20px; color: var(--muted); }
  .grid { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 16px; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  video { width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 8px; display: block; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  input, select { width: 100%; padding: 7px 9px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--fg); font: 13px ui-monospace, "SF Mono", Menlo, monospace; }
  .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  button { padding: 8px 14px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--fg); font: inherit; cursor: pointer; }
  button.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .status { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px; }
  .pill { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
  .pill.ok { color: var(--ok); border-color: var(--ok); }
  .pill.err { color: var(--err); border-color: var(--err); }
  #log { margin-top: 16px; background: var(--code-bg); border-radius: 8px; padding: 10px; height: 260px; overflow: auto; font: 12px/1.45 ui-monospace, "SF Mono", Menlo, monospace; white-space: pre-wrap; word-break: break-word; }
  .l-ok { color: var(--ok); } .l-err { color: var(--err); } .l-warn { color: var(--warn); }
  details { margin-top: 10px; } summary { cursor: pointer; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<main>
  <h1>DRM Test Player</h1>
  <p class="sub">Shaka Player against DRMtoday staging. Widevine: Chrome/Firefox. PlayReady: Edge on Windows (cbcs needs a recent PlayReady). FairPlay: needs Apple FPS credentials in DRMtoday first.</p>

  <div class="grid">
    <section class="card">
      <video id="video" controls autoplay muted playsinline></video>
      <div class="status" id="status"></div>
      <div id="log" aria-live="polite"></div>
    </section>

    <section class="card">
      <label for="manifest">Manifest</label>
      <select id="format">
        <option value="dash">DASH — manifest.mpd</option>
        <option value="hls">HLS — playlist.m3u8</option>
      </select>
      <label for="base">Stream base URL</label>
      <input id="base" value="https://edge-l1-in-bom-ovh01.cdnized.com/origin/drmtest/test">

      <label>x-dt-custom-data (DRMtoday Test dummy values)</label>
      <div class="row">
        <input id="userId" value="purchase" aria-label="userId" title="userId">
        <input id="sessionId" value="default" aria-label="sessionId" title="sessionId">
        <input id="merchant" value="5centscdn" aria-label="merchant" title="merchant">
      </div>

      <details>
        <summary>License servers</summary>
        <label for="wv">Widevine</label>
        <input id="wv" value="https://lic.staging.drmtoday.com/license-proxy-widevine/cenc/?specConform=true">
        <label for="pr">PlayReady</label>
        <input id="pr" value="https://lic.staging.drmtoday.com/license-proxy-headerauth/drmtoday/RightsManager.asmx">
      </details>

      <div class="actions">
        <button class="primary" id="play">Load &amp; play</button>
        <button id="stop">Stop</button>
        <button id="clear">Clear log</button>
      </div>
    </section>
  </div>
</main>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const logEl = $('log');
  const fields = ['format', 'base', 'userId', 'sessionId', 'merchant', 'wv', 'pr'];
  let player = null;

  function log(msg, cls) {
    const line = document.createElement('div');
    if (cls) line.className = cls;
    line.textContent = new Date().toLocaleTimeString() + '  ' + msg;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
  }
  function pill(text, cls) {
    const s = document.createElement('span');
    s.className = 'pill' + (cls ? ' ' + cls : '');
    s.textContent = text;
    $('status').appendChild(s);
  }

  // Remember the form per browser (convenience only).
  try {
    const saved = JSON.parse(localStorage.getItem('drm-test-player') || '{}');
    fields.forEach((f) => { if (saved[f]) $(f).value = saved[f]; });
  } catch (e) {}
  function save() {
    try {
      const o = {};
      fields.forEach((f) => { o[f] = $(f).value; });
      localStorage.setItem('drm-test-player', JSON.stringify(o));
    } catch (e) {}
  }

  async function probeKeySystems() {
    const base = { initDataTypes: ['cenc'], videoCapabilities: [{ contentType: 'video/mp4; codecs="avc1.4d001f"', encryptionScheme: 'cbcs' }] };
    for (const [name, ks] of [['Widevine', 'com.widevine.alpha'], ['PlayReady', 'com.microsoft.playready'], ['PlayReady (HW)', 'com.microsoft.playready.recommendation']]) {
      try {
        await navigator.requestMediaKeySystemAccess(ks, [base]);
        pill(name + ' cbcs: yes', 'ok');
      } catch (e) {
        pill(name + ' cbcs: no');
      }
    }
  }

  function describeError(e) {
    const d = e && e.detail ? e.detail : e;
    if (d && d.code !== undefined) {
      const names = Object.keys(shaka.util.Error.Code).filter((k) => shaka.util.Error.Code[k] === d.code);
      let extra = '';
      try { extra = d.data && d.data.length ? ' data=' + JSON.stringify(d.data, (k, v) => (v instanceof ArrayBuffer || ArrayBuffer.isView(v)) ? '[' + v.byteLength + ' bytes]' : v).slice(0, 600) : ''; } catch (_) {}
      return 'Shaka error ' + d.code + ' (' + (names[0] || '?') + ') category=' + d.category + extra;
    }
    return String(d && d.message ? d.message : d);
  }

  async function start() {
    save();
    if (!window.isSecureContext) {
      log('Not a secure context: EME is unavailable. Open this page over HTTPS.', 'l-err');
      return;
    }
    if (location.protocol === 'https:' && /^http:/i.test($('base').value.trim())) {
      log('The stream URL is plain http:// and this page is https://, so the browser will block it (mixed content). Use an https:// stream URL (nginx proxy to the origin).', 'l-err');
      return;
    }
    if (player) { await player.destroy(); player = null; }
    shaka.polyfill.installAll();
    if (!shaka.Player.isBrowserSupported()) { log('Shaka Player: this browser is not supported.', 'l-err'); return; }

    const video = $('video');
    player = new shaka.Player();
    await player.attach(video);

    const custom = btoa(JSON.stringify({ userId: $('userId').value.trim(), sessionId: $('sessionId').value.trim(), merchant: $('merchant').value.trim() }));
    player.configure({
      drm: {
        servers: {
          'com.widevine.alpha': $('wv').value.trim(),
          'com.microsoft.playready': $('pr').value.trim(),
        },
      },
    });

    const net = player.getNetworkingEngine();
    const LICENSE = shaka.net.NetworkingEngine.RequestType.LICENSE;
    net.registerRequestFilter((type, req) => {
      if (type === LICENSE) {
        req.headers['x-dt-custom-data'] = custom;
        log('License request → ' + req.uris[0].split('?')[0]);
      }
    });
    net.registerResponseFilter((type, resp) => {
      if (type === LICENSE) log('License response ← HTTP ' + (resp.status || 200) + ', ' + resp.data.byteLength + ' bytes', 'l-ok');
    });

    player.addEventListener('error', (e) => log(describeError(e), 'l-err'));
    video.addEventListener('playing', () => log('Playing — decryption works.', 'l-ok'), { once: true });

    const url = $('base').value.replace(/\/+$/, '') + ($('format').value === 'hls' ? '/playlist.m3u8' : '/manifest.mpd');
    log('Loading ' + url);
    try {
      await player.load(url);
      const info = player.drmInfo();
      log('Manifest loaded. Key system: ' + (info ? info.keySystem : 'none (clear?)'));
      const kids = info && info.keyIds ? Array.from(info.keyIds) : [];
      if (kids.length) log('Key IDs in manifest: ' + kids.join(', '));
    } catch (e) {
      log(describeError(e), 'l-err');
      if (e && e.code === 6007) log('6007 = license request failed: check the custom data values / Test dummy setting in DRMtoday.', 'l-warn');
      if (e && e.code === 6001) log('6001 = no key system available: this browser/CDM has no cbcs support for any configured DRM.', 'l-warn');
    }
  }

  $('play').addEventListener('click', start);
  $('stop').addEventListener('click', async () => { if (player) { await player.unload(); log('Stopped.'); } });
  $('clear').addEventListener('click', () => { logEl.textContent = ''; });
  probeKeySystems();
  log('Ready. Click "Load & play".');
})();
</script>
</body>
</html>
